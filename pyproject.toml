[project]
name = "lift-rl"
version = "0.1.0"
description = "Franka cube lift with PPO on Isaac Lab 3.0 (Newton physics, no Isaac Sim)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab[newton,rsl-rl]==3.0.0b2.post1",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "scipy==1.16.2",
    "usd-core==25.11",
    "usd-exchange==3.0.0",
    "pytest>=8",
    "imageio[ffmpeg]>=2.34",
    "matplotlib>=3.9",
    "tensorboard>=2.17",
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
